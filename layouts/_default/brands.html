{{ define "main" }}
<div class="bg-white">
    <div class="container mx-auto px-4 py-16 lg:py-24">
        <div class="text-center mb-16">
            <h1 class="text-5xl font-serif font-bold tracking-tight text-brand-dark">{{ .Title }}</h1>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-3 gap-6 max-w-6xl mx-auto">
            {{ range .Site.Data.brands }}
            <a href="{{ printf "/products/%s/" (.name | urlize) }}" 
               class="block bg-brand-gray p-8 rounded-lg text-center hover:shadow-2xl hover:-translate-y-2 transition-all duration-300 group flex flex-col justify-center items-center aspect-w-1 aspect-h-1">
                <img src="{{ printf "/images/logos/%s" .logo }}" 
                     alt="{{ .name }}" 
                     class="h-8 md:h-10 w-auto object-contain transition-transform duration-300 group-hover:scale-110">
                <span class="mt-4 font-sans text-sm uppercase tracking-widest text-gray-500">{{ .name }}</span>
            </a>
            {{ end }}
        </div>
    </div>
</div>
{{ end }}
