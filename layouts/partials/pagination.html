{{ $paginator := .Paginator }}
{{ if gt $paginator.TotalPages 1 }}
<div class="flex justify-center items-center space-x-2 text-lg">

    {{ with $paginator.Prev }}
    <a href="{{ .URL }}" class="px-4 py-2 bg-white border rounded hover:bg-gray-100">&laquo; Prev</a>
    {{ end }}

    {{ range $paginator.Pagers }}
    <a href="{{ .URL }}" class="px-4 py-2 border rounded {{ if eq . $paginator }}bg-blue-600 text-white border-blue-600{{ else }}bg-white hover:bg-gray-100{{ end }}">
        {{ .PageNumber }}
    </a>
    {{ end }}

    {{ with $paginator.Next }}
    <a href="{{ .URL }}" class="px-4 py-2 bg-white border rounded hover:bg-gray-100">Next &raquo;</a>
    {{ end }}

</div>
{{ end }}
